name: Issue labels

# Pullfrog proposes triage. The repository's label script owns all issue writes.
# Edited issues are handled only while unlabeled. Manual backfill defaults to dry run.
on:
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:
    inputs:
      issues:
        description: Issue numbers separated by spaces, or unlabeled.
        required: true
        type: string
      dry_run:
        description: Show proposed labels and triage in Actions without writing to issues.
        type: boolean
        default: true

permissions: {}

jobs:
  select:
    name: select issues
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      issues: ${{ steps.select.outputs.issues }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci/label-issue.py
          sparse-checkout-cone-mode: false
      - name: Resolve issue numbers
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUES: ${{ inputs.issues }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch ]]; then
            if [[ "$DRY_RUN" != true && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo '::error::Use the default branch to apply issue labels.'
              exit 1
            fi
            python3 ci/label-issue.py select "$INPUT_ISSUES"
          elif [[ "$ACTION" == edited ]]; then
            python3 ci/label-issue.py select "$ISSUE" --only-if-unlabeled
          else
            python3 ci/label-issue.py select "$ISSUE"
          fi

  triage:
    name: 'triage issue #${{ matrix.issue.number }}'
    needs: select
    if: needs.select.outputs.issues != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        issue: ${{ fromJSON(needs.select.outputs.issues) }}
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/triage-issue.yml
    with:
      number: ${{ matrix.issue.number }}
      only_if_unlabeled: ${{ matrix.issue.only_if_unlabeled }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      comment: ${{ github.event_name == 'issues' && github.event.action == 'opened' }}
